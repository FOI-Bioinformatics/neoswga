name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        # Pin black/isort to exact versions: their formatting output changes
        # between releases, so an unpinned range makes `--check` nondeterministic
        # (a newer black on the runner can demand reformatting the repo cannot
        # reproduce locally). Bump deliberately, reformatting in the same commit.
        run: pip install "black==26.5.1" "isort==8.0.1" "ruff>=0.5.0" "mypy>=1.0"

      - name: Check formatting with black
        run: black --check neoswga/

      - name: Check import ordering with isort
        run: isort --check neoswga/

      - name: Lint with ruff (BLOCKING, defect-prone rules only)
        # Blocking because these catch wrong behaviour, not style, and the
        # package is already clean of every one of them -- so this costs
        # nothing today and guards against the next instance.
        #
        # Kept narrow deliberately. The full ruff run reports about 2,700
        # findings in `neoswga/`, of which roughly 2,200 are typing
        # modernisation (`typing.List` -> `list`) with no behavioural content.
        # Blocking on those would mean a 2,200-line mechanical diff for no
        # defect caught, and would bury the rules that do catch defects.
        #
        # The case for this step is not hypothetical: the `zip()`-without-
        # `strict` family surfaced a real one on 2026-09-22, where coverage
        # analysis silently dropped a target when two params.json lists
        # disagreed. B905 is NOT yet in this set -- 64 sites need a judgement
        # each -- which is the next increment.
        run: >
          ruff check neoswga
          --select E711,E712,E713,E714,F632,F702,B006,B008,B017,S102,S307

      - name: Lint with ruff (non-blocking informational baseline)
        continue-on-error: true
        run: ruff check neoswga tests

      - name: Static type check with mypy (non-blocking informational baseline)
        continue-on-error: true
        run: mypy neoswga --ignore-missing-imports --no-strict-optional

      - name: Dependency vulnerability audit (advisory, not blocking)
        # Suppressed once, not twice. This step carried BOTH
        # `continue-on-error: true` and a trailing `|| true`, and the second
        # one is the harmful half: it makes the step exit 0 whatever pip-audit
        # found, so a run with vulnerable dependencies renders as a green tick
        # beside the words "vulnerability audit". A reader glancing at CI reads
        # that as "no vulnerabilities" -- which is this repository's recurring
        # defect, a favourable default standing in for an unmeasured result.
        #
        # `continue-on-error` alone is the honest form of the same policy: a
        # finding shows the step as not-green and annotates the run, while the
        # job still passes. Nobody is blocked and nobody is misled.
        #
        # Not blocking, deliberately. A CVE published against a transitive
        # dependency turns CI red with no change to this repository, which
        # trains people to merge through a red tick. Making it blocking is a
        # decision about who fields that alert, not a repair.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --progress-spinner off

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      # Run every cell to completion. With fail-fast the first cell to fail
      # cancels the other five, and a fault specific to one runner then
      # presents as a total failure across every platform: a missing wheel for
      # an optional dependency on macos/3.12 once cancelled all six jobs, and
      # telling that apart from a real regression needed per-job API queries.
      # Six matrix cells are cheap; misreading them is not.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Jellyfish (k-mer counter)
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y jellyfish
          else
            brew install jellyfish
          fi

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest tests/ -q --tb=short --cov=neoswga --cov-report=term-missing --cov-fail-under=50

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      - name: Install the built wheel and import-smoke it
        # Guards the packaging-omission class: a wheel can build + pass `twine
        # check` yet omit a subpackage (e.g. neoswga.cli) or data file (the
        # model / checksums), breaking real installs. Install into a clean venv
        # and import the entry point + every cli submodule + the bundled model.
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/python - <<'PY'
          import importlib, pkgutil
          import neoswga.cli_unified  # entry point
          import neoswga.cli as cli_pkg
          subs = [m.name for m in pkgutil.iter_modules(cli_pkg.__path__)]
          assert subs, "neoswga.cli shipped with no submodules"
          for name in subs:
              importlib.import_module(f"neoswga.cli.{name}")
          # bundled model + checksums must be present in the installed package
          from importlib.resources import files
          models = files("neoswga.core") / "models"
          assert (models / "random_forest_filter.skops").is_file(), "model not packaged"
          assert (models / "checksums.json").is_file(), "checksums not packaged"
          report_tpl = files("neoswga.core.report") / "templates" / "technical_report.html"
          assert report_tpl.is_file(), "report HTML template not packaged"
          print(f"wheel import-smoke OK: cli submodules={len(subs)}, model+checksums+template present")
          PY

      - name: Run the installed console script
        # Importing `neoswga.cli_unified` does not prove the `neoswga` entry
        # point is wired: a wheel can ship every module and still declare the
        # console script wrongly, and the import-smoke above would pass. These
        # are the three commands that need no genome, no jellyfish and no
        # params file, so they run anywhere.
        run: |
          /tmp/wheel-venv/bin/neoswga --version
          /tmp/wheel-venv/bin/neoswga --help > /dev/null
          /tmp/wheel-venv/bin/neoswga show-presets > /dev/null
          echo "installed console script OK"
