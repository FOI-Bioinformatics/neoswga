name: Nightly E2E

# Runs what the pull-request suite deliberately does not: the @pytest.mark.scale
# tests, and the plasmid example driven through the real command line. Fires on
# cron and on manual dispatch.
#
# The split is the point. CI runs `-m "not scale"` on every pull request; this
# workflow runs `-m scale` and nothing else. Until 2026-09-24 it was the other
# way round -- the marker documented itself as "opt-in; nightly workflow only"
# while CI ran those tests in all six cells and this workflow excluded them with
# `-m "not scale"`. One of the four is a memory measurement, which is the kind
# least suited to six heterogeneous runners and best suited to a nightly.
#
# The rest of what this workflow used to run -- tests/integration/ and two named
# files -- is a subset of the `pytest tests/` that every pull request already
# runs, so it is not repeated here. What remains genuinely unique is the `improved`
# extra, which CI does not install, and the command-line walk below.

on:
  schedule:
    - cron: "0 4 * * *"  # 04:00 UTC daily
  workflow_dispatch:

jobs:
  e2e:
    name: End-to-end pipeline smoke tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.13 only, matching `requires-python`.
        python-version: ["3.13"]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Jellyfish (k-mer counter)
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y jellyfish
          else
            brew install jellyfish
          fi

      - name: Install neoswga with dev extras
        run: pip install -e ".[dev,improved]"

      - name: Run the scale-marked tests
        # These are the opt-in tests, and this is the workflow their marker
        # names. Everything else in tests/ runs on every pull request.
        run: pytest tests/ -m scale -q --timeout=600

      - name: Run plasmid example end-to-end
        run: |
          cd examples/plasmid_example
          neoswga validate --quick
          neoswga count-kmers -j params.json
          neoswga filter -j params.json
          neoswga prepare-candidates -j params.json
          neoswga optimize -j params.json
          neoswga report -d .

      - name: Upload pipeline artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-pipeline-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            examples/plasmid_example/report.html
            examples/plasmid_example/step2_df.csv
            examples/plasmid_example/step3_df.csv
            examples/plasmid_example/step4_improved_df.csv
          if-no-files-found: ignore
